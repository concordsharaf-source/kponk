<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جيب - Jaib</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f11;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* الحاوية الرئيسية للتطبيق */
        .app-wrapper {
            position: relative;
            width: 100%;
            max-width: 414px; /* حجم الشاشة القياسي للجوال */
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* صورة خلفية التطبيق */
        .app-screen {
            width: 100%;
            display: block;
            height: auto;
        }

        /* المربع الأحمر المغطي لمكان المبلغ */
        .balance-overlay-box {
            position: absolute;
            top: 29.3%;         /* التموضع العمودي فوق الرقم */
            right: 27.5%;        /* التموضع الأفقي من اليمين */
            width: 36%;         /* عرض المربع لتغطية الرقم بالكامل */
            height: 4.8%;       /* ارتفاع المربع */
            background-color: #ea1a3a; /* نفس درجة اللون الأحمر المحددة من البطاقة */
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-left: 5px;
            z-index: 5;
            border-radius: 4px; /* تنعيم بسيط للحواف للتداخل مع البطاقة */
        }

        /* النص داخل المربع الأحمر */
        .balance-text {
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 21px;
            line-height: 1;
            letter-spacing: 0.5px;
            user-select: none;
        }

        /* شكل النقاط في حالة المخفي */
        .balance-text.dots {
            font-size: 24px;
            letter-spacing: 2px;
        }

        /* زر شفاف مخفي تماماً يوضع فوق أيقونة العين في الصورة */
        .eye-click-trigger {
            position: absolute;
            top: 39%;           /* موقع علامة العين بالعمود */
            right: 28%;         /* موقع علامة العين بالفق */
            width: 12%;         /* مساحة الضغط */
            height: 4.5%;       /* ارتفاع مساحة الضغط */
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- مسار صورة الواجهة الكاملة التي أرفقتها -->
        <img src="image/app.jpg" alt="Jaib App" class="app-screen">

        <!-- المربع الأحمر الذي يغطي المبلغ الأصلي بالصورة -->
        <div class="balance-overlay-box">
            <span id="balanceText" class="balance-text dots">•••••</span>
        </div>

        <!-- زر شفاف مخفي فوق عين البطاقة -->
        <button class="eye-click-trigger" onclick="toggleBalance()" aria-label="إظهار/إخفاء الرصيد"></button>
    </div>

    <script>
        // المبلغ المراد إظهاره عند الضغط بنفس خط وحجم التطبيق
        const actualAmount = "3,475.5";
        const hiddenDots = "•••••";

        let isVisible = false;

        function toggleBalance() {
            const balanceEl = document.getElementById('balanceText');
            isVisible = !isVisible;

            if (isVisible) {
                balanceEl.textContent = actualAmount;
                balanceEl.classList.remove('dots');
            } else {
                balanceEl.textContent = hiddenDots;
                balanceEl.classList.add('dots');
            }
        }
    </script>
</body>
</html>
