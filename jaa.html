<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جيب - Jaib</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f11;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية التطبيق الذكية - تفعل خاصية Container Queries */
        .app-wrapper {
            position: relative;
            width: 100%;
            max-width: 430px; /* ليتناسب مع حجم الشاشات الكبيرة مثل S24 Ultra */
            margin: 0 auto;
            overflow: hidden;
            container-type: inline-size; /* يجعل الحسابات نسبية لعرض الحاوية نفسها */
        }

        /* صورة خلفية التطبيق */
        .app-screen {
            width: 100%;
            display: block;
            height: auto;
        }

        /* المربع الأحمر المتموضع بدقة فوق رقم 3,475.5 */
        .balance-overlay-box {
            position: absolute;
            top: 29.8%;         /* إحداثيات دقيقة موجهة لصورة الشاشة الكاملة */
            right: 26.5%;
            width: 38%;
            height: 4.2%;
            background-color: #eb1938; /* نفس درجة أحمر البطاقة بالظبط */
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-left: 2cqi;
            z-index: 5;
            border-radius: 2px;
        }

        /* نص الرصيد - يتغير حجمه تلقائياً بناءً على عرض الشاشة */
        .balance-text {
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 5.3cqi;  /* يتصاغر ويتكبر بنسبة مئوية مع الصورة */
            line-height: 1;
            letter-spacing: 0.2cqi;
            user-select: none;
        }

        /* شكل النقاط في حالة الإخفاء */
        .balance-text.dots {
            font-size: 5.8cqi;
            letter-spacing: 0.5cqi;
        }

        /* زر العين الشفاف التفاعلي */
        .eye-click-trigger {
            position: absolute;
            top: 38.5%;        /* تموضع الزر فوق عين البطاقة الحمراء */
            right: 27%;
            width: 14%;
            height: 4.5%;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- صورة الواجهة الكاملة -->
        <img src="image/app.jpg" alt="Jaib App" class="app-screen">

        <!-- المربع الأحمر التفاعلي -->
        <div class="balance-overlay-box">
            <span id="balanceText" class="balance-text dots">•••••</span>
        </div>

        <!-- زر شفاف فوق أيقونة العين -->
        <button class="eye-click-trigger" onclick="toggleBalance()" aria-label="إظهار/إخفاء الرصيد"></button>
    </div>

    <script>
        const actualAmount = "3,475.5";
        const hiddenDots = "•••••";
        let isVisible = false;

        function toggleBalance() {
            const balanceEl = document.getElementById('balanceText');
            isVisible = !isVisible;

            if (isVisible) {
                balanceEl.textContent = actualAmount;
                balanceEl.classList.remove('dots');
            } else {
                balanceEl.textContent = hiddenDots;
                balanceEl.classList.add('dots');
            }
        }
    </script>
</body>
</html>
