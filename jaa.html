<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جيب - Jaib</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f0f11;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية التطبيق */
        .app-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            line-height: 0; /* لمنع أي فراغات أسفل الصورة */
            container-type: inline-size;
        }

        /* صورة الواجهة الكاملة */
        .app-screen {
            width: 100%;
            height: auto;
            display: block;
        }

        /* المربع الأحمر المتموضع بدقة فوق رقم 3,475.5 */
        .balance-overlay-box {
            position: absolute;
            top: 15.2%;         /* الموقع الدقيق للرقم من الأعلى */
            right: 25.5%;        /* الموقع الدقيق من اليمين */
            width: 38%;         /* عرض تغطية الرقم */
            height: 3.8%;       /* ارتفاع تغطية الرقم */
            background-color: #ea1a3a; /* نفس درجة أحمر البطاقة */
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-left: 1cqi;
            z-index: 5;
            border-radius: 3px;
            
            /* يمكنك إزالة التعليق عن السطر التالي لترى إطاراً أصفر يحدد موقع المربع للتأكد */
            /* border: 1px solid yellow; */
        }

        /* نص الرصيد والنقاط */
        .balance-text {
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-weight: 800;
            font-size: 5.2cqi;
            line-height: 1;
            letter-spacing: 0.2cqi;
            user-select: none;
        }

        /* شكل النقاط في حالة المخفي */
        .balance-text.dots {
            font-size: 5.5cqi;
            letter-spacing: 0.4cqi;
        }

        /* زر العين المخفي الشفاف فوق أيقونة العين بالبطاقة */
        .eye-click-trigger {
            position: absolute;
            top: 27%;           /* موقع عين البطاقة الحمراء */
            right: 26.5%;       /* موقع العين من اليمين */
            width: 14%;         /* مساحة الضغط */
            height: 4%;         /* ارتفاع مساحة الضغط */
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- صورة الواجهة الكاملة -->
        <img src="image/app.jpg" alt="Jaib App" class="app-screen">

        <!-- المربع الأحمر المتفاعل -->
        <div class="balance-overlay-box">
            <span id="balanceText" class="balance-text dots">•••••</span>
        </div>

        <!-- زر شفاف مخفي فوق أيقونة العين -->
        <button class="eye-click-trigger" onclick="toggleBalance()" aria-label="إظهار/إخفاء الرصيد"></button>
    </div>

    <script>
        const actualAmount = "3,475.5";
        const hiddenDots = "•••••";
        let isVisible = false;

        function toggleBalance() {
            const balanceEl = document.getElementById('balanceText');
            isVisible = !isVisible;

            if (isVisible) {
                balanceEl.textContent = actualAmount;
                balanceEl.classList.remove('dots');
            } else {
                balanceEl.textContent = hiddenDots;
                balanceEl.classList.add('dots');
            }
        }
    </script>
</body>
</html>
